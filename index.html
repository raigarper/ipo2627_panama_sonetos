<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonetos · Lector</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script type="module" src="js/app.js"></script>
</head>

<body class="pagina">

  <main class="lector" data-navegacion>

    <!-- Vista A · Inicio y búsqueda -->
    <section class="vista vista--inicio" data-vista="inicio">

      <div class="portada">
        <h1 class="portada__titulo">Sonetos</h1>
        <p class="portada__lema">Catorce versos para leer despacio</p>

        <div class="buscador" data-buscador>
          <label class="visualmente-oculta" for="buscador-campo">Buscar soneto</label>

          <div class="buscador__caja">
            <input class="buscador__campo" id="buscador-campo" type="search" role="combobox"
                   placeholder="Busca por título, autor o verso…" autocomplete="off" spellcheck="false"
                   aria-expanded="false" aria-controls="buscador-lista" aria-autocomplete="list"
                   data-buscador-campo>

            <ul class="buscador__lista" id="buscador-lista" role="listbox" aria-label="Sonetos disponibles"
                hidden data-buscador-lista></ul>
          </div>
        </div>
      </div>

    </section>

    <!-- Vista B · Lectura del soneto -->
    <section class="vista vista--lectura vista--oculta" data-vista="lectura" hidden>

      <nav class="lectura__acciones" aria-label="Navegación del lector">
        <button class="boton boton--volver" type="button" data-volver>
          <span class="boton__icono" aria-hidden="true">←</span>
          Volver a la búsqueda
        </button>
      </nav>

      <article class="soneto soneto--vacio" aria-live="polite" data-soneto></article>

    </section>

  </main>

  <footer class="pie">
    <p class="pie__texto">Práctica de Interacción Persona-Ordenador · Lector de sonetos</p>
  </footer>

</body>

</html>
